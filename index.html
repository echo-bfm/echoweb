<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ECHO: In-Context Behavior Foundation Model for Humanoid Whole-Body Control.">
  <title>ECHO | Research Project</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17211e;
      background: #f5f6f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main {
      width: min(100% - 40px, 960px);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-content: center;
      padding: 72px 0;
    }
    .eyebrow {
      margin: 0 0 22px;
      color: #477a68;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(64px, 12vw, 132px);
      line-height: .9;
      letter-spacing: -.085em;
    }
    h2 {
      max-width: 760px;
      margin: 28px 0 0;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 550;
      line-height: 1.16;
      letter-spacing: -.045em;
    }
    .summary {
      max-width: 620px;
      margin: 22px 0 0;
      color: #5b6862;
      font-size: 17px;
      line-height: 1.7;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid #17211e;
      border-radius: 999px;
      background: #17211e;
      color: white;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }
    .button:hover { transform: translateY(-2px); background: #315b4b; }
    .button:focus-visible { outline: 3px solid #77b49a; outline-offset: 3px; }
    footer {
      margin-top: 92px;
      padding-top: 18px;
      border-top: 1px solid #d9ded8;
      color: #77817c;
      font-size: 12px;
      letter-spacing: .04em;
    }
    @media (max-width: 560px) {
      main { width: min(100% - 32px, 960px); }
      .summary { font-size: 16px; }
      footer { margin-top: 64px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Humanoid Robotics Research</p>
    <h1>ECHO</h1>
    <h2>In-Context Behavior Foundation Model for Humanoid Whole-Body Control</h2>
    <p class="summary">A shared behavior prior uses interaction history to adapt whole-body control to changing physical conditions, without test-time parameter updates.</p>
    <footer>Research project page</footer>
  </main>
</body>
</html>
